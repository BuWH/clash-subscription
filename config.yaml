rules:
  # Streaming/video service whitelists - must be before ad blocking rules
  # (reject list aggressively blocks functional domains like P2P, CDN, playback APIs)
  - RULE-SET,tencent_video,DIRECT
  - RULE-SET,huya,DIRECT
  - RULE-SET,douyu,DIRECT
  - RULE-SET,bilibili,DIRECT
  - RULE-SET,weibo,DIRECT
  - RULE-SET,sina,DIRECT
  - DOMAIN,vi.l.qq.com,DIRECT
  - DOMAIN,vd6.l.qq.com,DIRECT
  # Futu / Moomoo trading - must be before REJECT and China direct rules
  - RULE-SET,futu,Trade
  # REJECT - Adblock4limbo (limbopro)
  - RULE-SET,adblock4limbo,REJECT
  # CRYPTO
  - RULE-SET,crypto,CRYPTO
  # AI
  - DOMAIN-KEYWORD,perplexity,AI_SERVICE
  - DOMAIN-KEYWORD,pplx,AI_SERVICE
  - RULE-SET,openai,AI_SERVICE
  - RULE-SET,gemini,AI_SERVICE
  - RULE-SET,claude,AI_SERVICE
  # Shopify stores (checkout/login blocked by datacenter IP detection)
  - DOMAIN-SUFFIX,graphpaper-tokyo.com,DIRECT
  - DOMAIN-SUFFIX,myshopify.com,DIRECT
  # HSBC
  - DOMAIN-KEYWORD,hsbc,HSBC
  # TRADING EDGE
  - DOMAIN-KEYWORD,tradingedge,TRADING_EDGE
  # APPLE
  - RULE-SET,apple,APPLE
  # MICROSOFT
  - RULE-SET,microsoft,PROXY
  # PROXY
  - RULE-SET,reddit,PROXY
  - RULE-SET,linkedin,PROXY
  # DIRECT
  - RULE-SET,applications,DIRECT
  - RULE-SET,direct,DIRECT
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  # DEFAULT
  - MATCH,PROXY
