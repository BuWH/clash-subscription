proxy-groups:
  # 代理的转发链, 在 proxies 中不应该包含 relay. 不支持 UDP.
  # 流量: clash <-> http <-> vmess <-> ss1 <-> ss2 <-> 互联网
  # - name: "relay"
  #   type: relay
  #   proxies:
  #     - http
  #     - vmess
  #     - ss1
  #     - ss2
  - name: APPLE
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Apple.png
    proxies:
      - PROXY
      - DIRECT
  - name: CRYPTO
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Want_Want_Letter.png
    proxies:
      - sg-agent-vless
      - sg-backup-vless
      - uc-c-vless
      - hk-b1ls-vless
      - DIRECT
  # url-test 可以自动选择与指定 URL 测速后，延迟最短的服务器
  - name: Fastest
    type: url-test
    proxies:
      - sg-agent-vless
      - sg-backup-vless
      - uc-c-vless
      - hk-b1ls-vless
    url: "http://www.gstatic.com/generate_204"
    interval: 300
  # fallback 可以尽量按照用户书写的服务器顺序，在确保服务器可用的情况下，自动选择服务器
  - name: Fallback
    type: fallback
    proxies:
      - sg-agent-vless
      - sg-backup-vless
      - hk-b1ls-vless
      - uc-c-vless
    url: "http://www.gstatic.com/generate_204"
    interval: 300
  # # load-balance 可以使相同 eTLD 请求在同一条代理线路上
  # - name: "load-balance"
  #   type: load-balance
  #   proxies:
  #     - ss1
  #     - ss2
  #     - vmess1
  #   url: 'http://www.gstatic.com/generate_204'
  #   interval: 300
  - name: AI_SERVICE
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Server.png
    proxies:
      - PROXY
      - sg-agent-vless
      - sg-backup-vless
      - uc-c-vless
      - hk-b1ls-vless
      - DIRECT
  - name: HSBC
    type: select
    proxies:
      - DIRECT
      - PROXY
  - name: TRADING_EDGE
    type: select
    proxies:
      - DIRECT
      - PROXY
  - name: Trade
    type: select
    proxies:
      - PROXY
      - Fallback
      - Fastest
      - sg-agent-vless
      - sg-backup-vless
      - uc-c-vless
      - hk-b1ls-vless
      - DIRECT
  # select 用来允许用户手动选择 代理服务器 或 服务器组
  # 您也可以使用 RESTful API 去切换服务器，这种方式推荐在 GUI 中使用
  - name: PROXY
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Proxy.png
    proxies:
      - Fallback
      - sg-agent-vless
      - sg-backup-vless
      - uc-c-vless
      - hk-b1ls-vless
