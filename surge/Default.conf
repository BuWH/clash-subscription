[Proxy Group]
APPLE = select, PROXY, DIRECT
CRYPTO = select, sg-agent, sg-backup, hk-b1ls, uc-c, DIRECT
AI_SERVICE = select, PROXY, sg-agent, sg-backup, hk-b1ls, uc-c, DIRECT
SPEEDTEST = select, DIRECT, PROXY
Fallback = fallback, sg-agent, sg-backup, hk-b1ls, uc-c, interval=300, timeout=5
PROXY = select, Fallback, sg-agent, sg-backup, hk-b1ls, uc-c

